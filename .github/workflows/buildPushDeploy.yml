name: Build, Push and Deploy

on:
  push:
    branches:
      - release

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: .

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    env:
      AWS_GITHUB_ROLE_ARN: ${{ secrets.AWS_GITHUB_ROLE_ARN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU (for buildx multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        if: ${{ env.AWS_GITHUB_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ROLE_ARN }}
          role-session-name: github-actions-buildpushdeploy
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (access keys fallback)
        if: ${{ env.AWS_GITHUB_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "${{ secrets.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ secrets.ECR_EVANGELIONERPV2_REPOSITORY }}" --region "${{ secrets.AWS_REGION }}" \
            || aws ecr create-repository --repository-name "${{ secrets.ECR_EVANGELIONERPV2_REPOSITORY }}" --region "${{ secrets.AWS_REGION }}"

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./EvangelionERPV2.Web/Dockerfile
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_EVANGELIONERPV2_REPOSITORY }}:latest
            aureofjunior/evangelionerpv2-repository:latest
          platforms: linux/amd64,linux/arm64

      - name: Build and push worker email image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./EvangelionERPV2.Worker.Email/Dockerfile
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_EVANGELIONERPV2_REPOSITORY }}:worker-email-latest
            aureofjunior/evangelionerpv2-worker-email:latest
          platforms: linux/amd64,linux/arm64

      - name: Build and push worker order image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./EvangelionERPV2.Worker.Order/Dockerfile
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_EVANGELIONERPV2_REPOSITORY }}:worker-order-latest
            aureofjunior/evangelionerpv2-worker-order:latest
          platforms: linux/amd64,linux/arm64

      - name: Build and push worker notification image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./EvangelionERPV2.Worker.Notification/Dockerfile
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_EVANGELIONERPV2_REPOSITORY }}:worker-notification-latest
            aureofjunior/evangelionerpv2-worker-notification:latest
          platforms: linux/amd64,linux/arm64

  # Phase 1 deploys to one EC2 instance running docker-compose.yml, not to ECS. The ECS path is
  # Phase 2: the task definitions still exist in terraform behind var.enable_ecs, and the
  # ECS_*_SERVICE_NAME secrets are deliberately left in place for when it comes back.
  #
  # SSM rather than SSH: no inbound port 22, no deploy key in GitHub secrets, and the instance
  # role already carries AmazonSSMManagedInstanceCore.
  deploy_to_instance:
    needs: build_and_push
    runs-on: ubuntu-latest
    env:
      AWS_GITHUB_ROLE_ARN: ${{ secrets.AWS_GITHUB_ROLE_ARN }}

    steps:
      - name: Configure AWS credentials (OIDC)
        if: ${{ env.AWS_GITHUB_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ROLE_ARN }}
          role-session-name: github-actions-deploy
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (access keys fallback)
        if: ${{ env.AWS_GITHUB_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Pull and restart on the instance
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
          APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
        run: |
          set -euo pipefail

          for env_name in AWS_REGION INSTANCE_ID; do
            if [ -z "${!env_name:-}" ]; then
              echo "Required environment variable ${env_name} is missing."
              exit 1
            fi
          done

          APP_DIR="${APP_DIR:-/opt/evangelion}"

          # `set -e` inside the remote script matters: without it a failed pull is followed by a
          # cheerful `up -d` that silently keeps the old containers running, and the deploy reports
          # success having changed nothing.
          COMMAND_ID="$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters commands="[\"set -euo pipefail\",\"cd ${APP_DIR}\",\"git fetch --prune origin release\",\"git checkout --detach ${GITHUB_SHA}\",\"docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml --profile workers --profile voice pull\",\"docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml --profile workers --profile voice up -d\",\"docker image prune -f\"]" \
            --query 'Command.CommandId' --output text)"

          echo "SSM command ${COMMAND_ID}"

          # send-command returns as soon as it is queued. Without waiting, a deploy that fails on
          # the box is a green build.
          if ! aws ssm wait command-executed \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}"; then
            echo "::error::Deploy command did not succeed."
          fi

          STATUS="$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query 'Status' --output text)"

          echo "--- stdout"
          aws ssm get-command-invocation --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" \
            --query 'StandardOutputContent' --output text || true

          if [ "${STATUS}" != "Success" ]; then
            echo "--- stderr"
            aws ssm get-command-invocation --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" \
              --query 'StandardErrorContent' --output text || true
            echo "Deploy finished with status ${STATUS}."
            exit 1
          fi

          echo "Deploy succeeded."

      - name: Verify the instance is serving
        env:
          HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          set -euo pipefail

          if [ -z "${HEALTH_URL:-}" ]; then
            echo "DEPLOY_HEALTH_URL not set; skipping the post-deploy check."
            exit 0
          fi

          # The containers restarting is not the same as the application answering. /health covers
          # SQL Server, Redis and the broker, so this fails loudly if a dependency is misconfigured
          # rather than leaving it to be discovered by a user.
          for attempt in $(seq 1 30); do
            body="$(curl -fsS --max-time 10 "${HEALTH_URL}" || true)"
            if [ "${body}" = "Healthy" ]; then
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 10
          done

          echo "::error::${HEALTH_URL} did not report Healthy within five minutes (last: ${body:-no response})."
          exit 1
