name: Build, Push and Deploy

on:
  pull_request:
    branches:
      - release

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: SonarQube analysis
      uses: SonarSource/sonarqube-scan-action@v1.1.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      with:
        args: >
          -Dsonar.projectKey=AureoFJunior_EvangelionERPV2
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          -Dsonar.sources=./EvangelionERPV2

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and Push Docker images
      working-directory: ./EvangelionERPV2.Web
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_EVANGELIONERPV2_REPOSITORY }}
      run: |
        docker-compose -f docker-compose.yml build
        
        for service in EvangelionERPV2.Web EvangelionERPV2.Worker.Email EvangelionERPV2.Worker.Order; do
          docker tag ${service}:latest $ECR_REGISTRY/$ECR_REPOSITORY:${service}-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${service}-latest
        done

  deploy_to_ecs:
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Deploy to Amazon ECS
      working-directory: ./EvangelionERPV2.Web
      run: |
        # Atualize aqui com o comando correto para seu deployment ECS
        # Exemplo usando task definition:
        aws ecs update-service --cluster seu-cluster --service seu-service --force-new-deployment