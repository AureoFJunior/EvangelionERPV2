name: Build, Push and Deploy

on:
  push:
    branches:
      - release

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: .

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU (for buildx multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        if: ${{ secrets.AWS_GITHUB_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: github-actions-buildpushdeploy
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (access keys fallback)
        if: ${{ secrets.AWS_GITHUB_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "${{ secrets.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ secrets.ECR_EVANGELIONERPV2_REPOSITORY }}" --region "${{ secrets.AWS_REGION }}" \
            || aws ecr create-repository --repository-name "${{ secrets.ECR_EVANGELIONERPV2_REPOSITORY }}" --region "${{ secrets.AWS_REGION }}"

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./EvangelionERPV2.Web/Dockerfile
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_EVANGELIONERPV2_REPOSITORY }}:latest
            aureofjunior/evangelionerpv2-repository:latest
          platforms: linux/amd64,linux/arm64

      - name: Build and push worker email image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./EvangelionERPV2.Worker.Email/Dockerfile
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_EVANGELIONERPV2_REPOSITORY }}:worker-email-latest
            aureofjunior/evangelionerpv2-worker-email:latest
          platforms: linux/amd64,linux/arm64

      - name: Build and push worker order image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./EvangelionERPV2.Worker.Order/Dockerfile
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_EVANGELIONERPV2_REPOSITORY }}:worker-order-latest
            aureofjunior/evangelionerpv2-worker-order:latest
          platforms: linux/amd64,linux/arm64

  deploy_to_ecs:
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        if: ${{ secrets.AWS_GITHUB_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: github-actions-deploy
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (access keys fallback)
        if: ${{ secrets.AWS_GITHUB_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy ECS services with configured names
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ secrets.ECR_EVANGELIONERPV2_REPOSITORY }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_WEB_SERVICE_NAME: ${{ secrets.ECS_SERVICE_NAME }}
          ECS_WORKER_EMAIL_SERVICE_NAME: ${{ secrets.ECS_WORKER_EMAIL_SERVICE_NAME }}
          ECS_WORKER_ORDER_SERVICE_NAME: ${{ secrets.ECS_WORKER_ORDER_SERVICE_NAME }}
        run: |
          set -euo pipefail

          required_envs=(
            AWS_REGION
            AWS_ACCOUNT_ID
            ECR_REPOSITORY
            ECS_CLUSTER
            ECS_WEB_SERVICE_NAME
            ECS_WORKER_EMAIL_SERVICE_NAME
            ECS_WORKER_ORDER_SERVICE_NAME
          )
          for env_name in "${required_envs[@]}"; do
            if [ -z "${!env_name:-}" ]; then
              echo "Required environment variable ${env_name} is missing."
              exit 1
            fi
          done

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ECR_IMAGE_BASE="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          WEB_CONTAINER_NAME="evangelionerpv2-container"
          WORKER_EMAIL_CONTAINER_NAME="evangelionerpv2-worker-email"
          WORKER_ORDER_CONTAINER_NAME="evangelionerpv2-worker-order"

          deploy_service() {
            local service_name="$1"
            local container_name="$2"
            local image_tag="$3"

            local image_uri="${ECR_IMAGE_BASE}:${image_tag}"
            echo "Deploying ${service_name} using ${image_uri}"

            local current_task_def_arn
            current_task_def_arn="$(aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${service_name}" \
              --region "${AWS_REGION}" \
              --query 'services[0].taskDefinition' \
              --output text)"

            if [ -z "${current_task_def_arn}" ] || [ "${current_task_def_arn}" = "None" ]; then
              echo "Could not resolve current task definition for service ${service_name}"
              exit 1
            fi

            aws ecs describe-task-definition \
              --task-definition "${current_task_def_arn}" \
              --region "${AWS_REGION}" \
              --query 'taskDefinition' > current-task-def.json

            if ! jq -e --arg CONTAINER_NAME "${container_name}" '.containerDefinitions[] | select(.name == $CONTAINER_NAME)' current-task-def.json >/dev/null; then
              echo "Container ${container_name} not found in task definition ${current_task_def_arn}"
              exit 1
            fi

            jq --arg IMAGE_URI "${image_uri}" --arg CONTAINER_NAME "${container_name}" '
              .containerDefinitions |= map(
                if .name == $CONTAINER_NAME then .image = $IMAGE_URI else . end
              )
              | del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy
                )
            ' current-task-def.json > new-task-def.json

            local new_task_def_arn
            new_task_def_arn="$(aws ecs register-task-definition \
              --cli-input-json file://new-task-def.json \
              --region "${AWS_REGION}" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)"

            aws ecs update-service \
              --cluster "${ECS_CLUSTER}" \
              --service "${service_name}" \
              --task-definition "${new_task_def_arn}" \
              --force-new-deployment \
              --region "${AWS_REGION}"
          }

          echo "Using ECS cluster ${ECS_CLUSTER}"
          echo "Web service ${ECS_WEB_SERVICE_NAME}"
          echo "Worker email service ${ECS_WORKER_EMAIL_SERVICE_NAME}"
          echo "Worker order service ${ECS_WORKER_ORDER_SERVICE_NAME}"

          deploy_service "${ECS_WEB_SERVICE_NAME}" "${WEB_CONTAINER_NAME}" "latest"
          deploy_service "${ECS_WORKER_EMAIL_SERVICE_NAME}" "${WORKER_EMAIL_CONTAINER_NAME}" "worker-email-latest"
          deploy_service "${ECS_WORKER_ORDER_SERVICE_NAME}" "${WORKER_ORDER_CONTAINER_NAME}" "worker-order-latest"
