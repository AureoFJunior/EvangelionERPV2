name: Build, Push and Deploy

on:
  pull_request:
    branches:
      - release

defaults:
 run:
  working-directory: ./EvangelionERPV2.Web

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:dind
        options: --privileged

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: SonarQube analysis
      uses: SonarSource/sonarqube-scan-action@v1.1.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      with:
        args: >
          -Dsonar.projectKey=AureoFJunior_EvangelionERPV2
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          -Dsonar.sources=./EvangelionERPV2

    - name: Login to Docker Hub
      run: docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build and Push Docker images
      run: |
        docker-compose -f docker-compose.yml build
        docker-compose -f docker-compose.yml push

    - name: Set up Docker
      uses: docker/setup-buildx-action@v1
      with:
        dockerfile: Dockerfile

    - name: Build Docker Image
      run: |
        docker build -f Dockerfile --no-cache -t evangelionerpv2-repository ..

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Get ECR registry URL
      id: ecr
      run: |
        ECR_REGISTRY=$(aws ecr describe-repositories --repository-names "${{ secrets.ECR_EVANGELIONERPV2_REPOSITORY }}" --region ${{ secrets.AWS_REGION }} --output json | jq -r '.repositories[0].repositoryUri')
        echo "::set-output name=registry_url::$ECR_REGISTRY"

    - name: Login to "evangelionerpv2" ECR
      run: |
        aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

    - name: Tag and Push Docker images to ECR
      run: |
        for service in EvangelionERPV2.Web EvangelionERPV2.Worker.Email EvangelionERPV2.Worker.Order; do
          docker tag $service:latest ${{ steps.ecr.outputs.registry_url }}/${{ secrets.ECR_EVANGELIONERPV2_REPOSITORY }}:$service-latest
          docker push ${{ steps.ecr.outputs.registry_url }}/${{ secrets.ECR_EVANGELIONERPV2_REPOSITORY }}:$service-latest
        done

  deploy_to_ecs:
    runs-on: ubuntu-latest
    needs: ["build_and_push"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Deploy to Amazon ECS
      run: |
        aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

        ecs-cli compose --file docker-compose.yml --project-name evangelionerpv2 service up
        ecs-cli compose --file docker-compose.yml --project-name evangelionerpv2 service ps
        ecs-cli compose --file docker-compose.yml --project-name evangelionerpv2 service wait

        echo "Deployment to Amazon ECS completed successfully."
