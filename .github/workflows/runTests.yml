name: Run Tests

on:
  pull_request:
    branches:
      - develop

jobs:
  setup-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '8.0'

    - name: Build and test 
      run: |
        dotnet restore
        dotnet build
        dotnet test EvangelionERPV2.OrderModule.Test/EvangelionERPV2.OrderModule.Test.csproj # Running Project Unit Tests