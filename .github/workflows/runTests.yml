name: Run Tests

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  setup-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0'

    - name: Build and test 
      run: |
        dotnet restore
        dotnet build
        dotnet test EvangelionERPV2.OrderModule.Test/EvangelionERPV2.OrderModule.Test.csproj # Running Project Unit Tests
