# Destroys the infrastructure in EvangelionERPV2.Web/terraform.
#
# Harmless until 2026-09-17 only because terraform had no state: a destroy against empty state
# destroys nothing. That is no longer true. Once the S3 backend is initialised this workflow can
# delete the production database, so it carries three guards, and no single one of them is the
# whole answer:
#
#   1. `prevent_destroy` on aws_db_instance in main.tf, which fails the plan outright.
#   2. `skip_final_snapshot = false`, so even a forced destroy leaves something to restore.
#   3. The typed confirmation below, plus the `destroy` environment - put a required reviewer on
#      that environment in repository settings if you have not already.
name: 'Destroy'

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy-production" to confirm. Anything else stops the run.'
        required: true
        default: ''

jobs:
  terraform:
    name: 'destroy'
    # Terraform is production-only. A manual dispatch from develop or release must do nothing.
    if: github.ref == 'refs/heads/main'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_aws_region: ${{ secrets.TF_AWS_REGION }}
      TF_VAR_s3_bucket_name: ${{ secrets.TF_S3_BUCKET_NAME }}
      TF_VAR_vpc_id: ${{ secrets.TF_VPC_ID }}
      TF_VAR_subnets: ${{ secrets.TF_SUBNETS_JSON }}
      TF_VAR_aws_iam_role_name: ${{ secrets.TF_AWS_IAM_ROLE_NAME }}
      TF_VAR_aws_ecr_repository_repository_url: ${{ secrets.TF_AWS_ECR_REPOSITORY_URL }}
      TF_VAR_aws_iam_role_arn: ${{ secrets.TF_AWS_IAM_ROLE_ARN }}
    runs-on: ubuntu-latest
    environment: destroy

    defaults:
      run:
        shell: bash
        working-directory: "EvangelionERPV2.Web/terraform"

    steps:
      - name: Refuse unless the confirmation matches
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy-production" ]; then
            echo "Confirmation phrase not given. Nothing was destroyed."
            exit 1
          fi
          echo "Confirmed by ${{ github.actor }}."

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.2.6

      - name: Terraform Init
        id: init
        run: terraform init 

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # A plan first, so the log records what was about to go. prevent_destroy on the database
      # makes this step fail rather than proceed, which is the intended outcome.
      - name: Terraform Plan (destroy)
        run: terraform plan -destroy -no-color

      - name: Terraform Destroy
        run: terraform destroy -no-color -auto-approve
