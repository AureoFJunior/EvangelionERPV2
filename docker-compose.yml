services:
  sqlserver:
    profiles:
      - localdb
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: evangelionerpv2_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:-EvangelionERP_Local!2026}
      MSSQL_PID: ${SQLSERVER_EDITION:-Developer}
    ports:
      - "${SQLSERVER_HOST_PORT:-14333}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - custom_network

  evangelionerpv2:
    image: ${WEB_IMAGE:-aureofjunior/evangelionerpv2-repository:latest}
    user: "${CONTAINER_USER:-1654:1654}"
    build:
      context: .
      dockerfile: EvangelionERPV2.Web/Dockerfile
      args:
        APP_UID: "${APP_UID:-1654}"
    container_name: evangelionerpv2_web
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: ${EVA_CONN_STR:-evangelion/prd/database:DefaultConnection}
      RedisSettings__InstanceName: ${EVA_REDIS_INSTANCE:-evangelion/prd/redis-name:instancename}
      RedisSettings__ConnectionString: ${EVA_REDIS_CONNECTION:-evangelion/prd/redis:ConnectionString}
      Encryption__Key: ${EVA_ENCRYPTION_KEY:-evangelion/prd/encryptionkey:key}
      Encryption__TokenKey: ${EVA_TOKEN_KEY:-evangelion/prd/encryptiontokenkey:key}
      AWSSettings__SecretName: "${EVA_AWS_SECRET_NAME:-AWSCredentials}"
      AWSSettings__BucketProducttName: "${EVA_AWS_PRODUCT_BUCKET:-evangelionerpv2images}"
      AWSSettings__BucketProductName: "${EVA_AWS_PRODUCT_BUCKET:-evangelionerpv2images}"
      AWSSettings__BucketUserName: "${EVA_AWS_USER_BUCKET:-evangelionerpv2images}"
      AWSSettings__Region: ${AWS_REGION:-us-east-1}
      EmailSettings__EnableInteractiveGoogleOAuthFallback: ${EVA_ENABLE_INTERACTIVE_EMAIL_OAUTH:-false}
      RabbitMQSettings__HostName: ${EVA_RABBITMQ_HOSTNAME:-evangelion/prd/rabbitmq-host:hostname}
      RabbitMQSettings__UserName: ${EVA_RABBITMQ_USERNAME:-evangelion/prd/rabbitmq-user:username}
      RabbitMQSettings__Password: ${EVA_RABBITMQ_PASSWORD:-evangelion/prd/rabbitmq-pass:password}
      RabbitMQSettings__VirtualHost: ${EVA_RABBITMQ_VHOST:-evangelion/prd/rabbitmq-vhost:vhost}
      RabbitMQSettings__Port: ${EVA_RABBITMQ_PORT:-evangelion/prd/rabbitmq-port:port}
      RabbitMQSettings__Uri: ${EVA_RABBITMQ_URI:-evangelion/prd/rabbitmq:uri}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: ${AWS_EC2_METADATA_DISABLED:-false}
      AWS_SDK_LOAD_CONFIG: ${AWS_SDK_LOAD_CONFIG:-1}
      HOME: ${CONTAINER_HOME:-/home/app}
      AWS_SHARED_CREDENTIALS_FILE: ${AWS_SHARED_CREDENTIALS_FILE:-/home/app/.aws/credentials}
      AWS_CONFIG_FILE: ${AWS_CONFIG_FILE:-/home/app/.aws/config}
    ports:
      - "${WEB_HOST_PORT:-5000}:8080"
    volumes:
      - type: bind
        source: ${AWS_CREDENTIALS_DIR:-./.docker/aws}
        target: /home/app/.aws
        read_only: true
    networks:
      - custom_network

  nginx:
    profiles:
      - proxy
    image: nginx:latest
    container_name: evangelionerpv2_nginx
    ports:
      - "${NGINX_HOST_PORT:-8082}:8082"
    volumes:
      - ./EvangelionERPV2.Web/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - custom_network
    depends_on:
      - evangelionerpv2

  worker_order:
    profiles:
      - workers
    image: ${WORKER_ORDER_IMAGE:-aureofjunior/evangelionerpv2-worker-order:latest}
    user: "${CONTAINER_USER:-1654:1654}"
    build:
      context: .
      dockerfile: EvangelionERPV2.Worker.Order/Dockerfile
      args:
        APP_UID: "${APP_UID:-1654}"
    container_name: evangelionerpv2_worker_order
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      HttpConfig__DefaultApiUrl: http://evangelionerpv2:8080/api/v1
      Encryption__Key: ${EVA_ENCRYPTION_KEY:-evangelion/prd/encryptionkey:key}
      SelfAPIAuth: ${EVA_WORKER_SELF_API_AUTH:-evangelion/prd/selfapilogin:log}
      RabbitMQSettings__HostName: ${EVA_RABBITMQ_HOSTNAME:-evangelion/prd/rabbitmq-host:hostname}
      RabbitMQSettings__UserName: ${EVA_RABBITMQ_USERNAME:-evangelion/prd/rabbitmq-user:username}
      RabbitMQSettings__Password: ${EVA_RABBITMQ_PASSWORD:-evangelion/prd/rabbitmq-pass:password}
      RabbitMQSettings__VirtualHost: ${EVA_RABBITMQ_VHOST:-evangelion/prd/rabbitmq-vhost:vhost}
      RabbitMQSettings__Port: ${EVA_RABBITMQ_PORT:-evangelion/prd/rabbitmq-port:port}
      RabbitMQSettings__Uri: ${EVA_RABBITMQ_URI:-evangelion/prd/rabbitmq:uri}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: ${AWS_EC2_METADATA_DISABLED:-false}
      AWS_SDK_LOAD_CONFIG: ${AWS_SDK_LOAD_CONFIG:-1}
      HOME: ${CONTAINER_HOME:-/home/app}
      AWS_SHARED_CREDENTIALS_FILE: ${AWS_SHARED_CREDENTIALS_FILE:-/home/app/.aws/credentials}
      AWS_CONFIG_FILE: ${AWS_CONFIG_FILE:-/home/app/.aws/config}
    volumes:
      - type: bind
        source: ${AWS_CREDENTIALS_DIR:-./.docker/aws}
        target: /home/app/.aws
        read_only: true
    networks:
      - custom_network
    depends_on:
      evangelionerpv2:
        condition: service_started

  worker_email:
    profiles:
      - workers
    image: ${WORKER_EMAIL_IMAGE:-aureofjunior/evangelionerpv2-worker-email:latest}
    user: "${CONTAINER_USER:-1654:1654}"
    build:
      context: .
      dockerfile: EvangelionERPV2.Worker.Email/Dockerfile
      args:
        APP_UID: "${APP_UID:-1654}"
    container_name: evangelionerpv2_worker_email
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      HttpConfig__DefaultApiUrl: http://evangelionerpv2:8080/api/v1
      Encryption__Key: ${EVA_ENCRYPTION_KEY:-evangelion/prd/encryptionkey:key}
      SelfAPIAuth: ${EVA_WORKER_SELF_API_AUTH:-evangelion/prd/selfapilogin:log}
      RabbitMQSettings__HostName: ${EVA_RABBITMQ_HOSTNAME:-evangelion/prd/rabbitmq-host:hostname}
      RabbitMQSettings__UserName: ${EVA_RABBITMQ_USERNAME:-evangelion/prd/rabbitmq-user:username}
      RabbitMQSettings__Password: ${EVA_RABBITMQ_PASSWORD:-evangelion/prd/rabbitmq-pass:password}
      RabbitMQSettings__VirtualHost: ${EVA_RABBITMQ_VHOST:-evangelion/prd/rabbitmq-vhost:vhost}
      RabbitMQSettings__Port: ${EVA_RABBITMQ_PORT:-evangelion/prd/rabbitmq-port:port}
      RabbitMQSettings__Uri: ${EVA_RABBITMQ_URI:-evangelion/prd/rabbitmq:uri}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: ${AWS_EC2_METADATA_DISABLED:-false}
      AWS_SDK_LOAD_CONFIG: ${AWS_SDK_LOAD_CONFIG:-1}
      HOME: ${CONTAINER_HOME:-/home/app}
      AWS_SHARED_CREDENTIALS_FILE: ${AWS_SHARED_CREDENTIALS_FILE:-/home/app/.aws/credentials}
      AWS_CONFIG_FILE: ${AWS_CONFIG_FILE:-/home/app/.aws/config}
    volumes:
      - type: bind
        source: ${AWS_CREDENTIALS_DIR:-./.docker/aws}
        target: /home/app/.aws
        read_only: true
    networks:
      - custom_network
    depends_on:
      evangelionerpv2:
        condition: service_started

networks:
  custom_network:
    driver: bridge

volumes:
  sqlserver_data:
