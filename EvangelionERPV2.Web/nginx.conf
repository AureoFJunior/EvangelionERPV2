# P1 found this: at ~400 requests a second a single worker with 1024 connections returned 62 364
# 502s while the API itself logged no errors at all and Prometheus recorded zero 5xx. The proxy was
# the bottleneck, not the application. `auto` matches the core count.
worker_processes auto;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Reuse upstream connections instead of opening one per request. Without this every proxied
    # request costs a fresh TCP connection to the API, which is what exhausted the worker at load.
    upstream evangelion_api {
        server evangelionerpv2:8080;
        keepalive 128;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8082;

        location /orderHub {
            access_log off;
            proxy_pass http://evangelionerpv2:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://evangelion_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Metrics are scraped on the internal docker network, on a port this proxy does not know
        # about. Nothing legitimate reaches them through here, and leaving the route open means one
        # relaxed RBAC policy is the whole distance between here and a public metrics endpoint.
        location = /metrics {
            return 404;
        }

        location /swagger {
            proxy_pass http://evangelionerpv2:8080/swagger;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
