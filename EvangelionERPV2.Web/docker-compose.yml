version: '3.8'

services:
  evangelionerpv2:
    image: aureofjunior/evangelionerpv2-repository:latest
    container_name: evangelionerpv2_web
    ports:
      - "5000:80"  # HOST 5000 - CONTAINER 80
    networks:
      - custom_network
    depends_on:
      - rabbitmq

  nginx:
    image: nginx:latest
    container_name: evangelionerpv2_nginx
    ports:
      - "8082:8082"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - custom_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: 'rabbitmq'
    ports:
        - 5672:5672
        - 15672:15672
    volumes:
        - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
        - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    networks:
        - custom_network

networks:
  custom_network:
    driver: bridge
