# Prometheus and Grafana, kept out of docker-compose.yml on purpose.
#
# The admin password below uses `:?`, which makes compose refuse to run without it - and compose
# interpolates the whole file whatever profile you asked for, so putting these services in the main
# file would break every `docker compose up` for anyone who has never heard of Grafana. Same pattern
# the repo already uses for docker-compose.gpu.yml: opt in by naming the file.
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d prometheus grafana
#
# or set COMPOSE_FILE=docker-compose.yml:docker-compose.observability.yml in .env.local.

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.1.0}
    container_name: evangelionerpv2_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 30 days. Grafana Cloud's free tier keeps 14, so this is the only place a month-over-month
      # comparison for docs/performance/SPEC-stress-test.md can come from.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      # Deliberately no --web.enable-lifecycle: it exposes an unauthenticated POST /-/reload to
      # anyone who reaches the port. The config lives in git; reloading it is a `compose restart`.
    # Loopback, unlike every other service in this project, and that is the point. Prometheus has no
    # login of any kind - upstream's position is that you put it behind something. A 0.0.0.0 bind
    # publishes every tenant's numbers to the LAN. Grafana is the only new port worth exposing,
    # because it is the only one that asks who you are.
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
      # The DIRECTORY is mounted, not the token file itself. Bind-mounting a file that does not
      # exist makes Docker create a directory in its place, and Prometheus then fails to read the
      # password in a way that reads as a config bug. Mounting the directory means a missing token
      # is just a missing file: remote_write warns and retries, the local TSDB carries on.
      #
      # The token file must be READABLE BY UID 65534 - this image runs as nobody, not as you. A
      # `chmod 600` file owned by your user gives "permission denied" on every push, which reads
      # exactly like a rejected credential and is not. Either 644, or keep 600 and chown it to
      # 65534. On ECS the question does not arise: the platform injects the secret itself.
      - ./.secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - custom_network

  # Dependency exporters.
  #
  # Redis and RabbitMQ are managed services (Upstash, CloudAMQP), so these do not run beside a
  # broker the way exporter sidecars usually do - they connect out over the internet. CloudAMQP does
  # not expose the rabbitmq_prometheus plugin on :15692, verified 2026-09-17, so the RabbitMQ
  # exporter reads the management API instead.
  #
  # All three are in the `exporters` profile, and every variable below has an empty default rather
  # than `:?`. That is deliberate and is the same trap this file's header describes: compose
  # interpolates the entire file before profiles select anything, so one `:?` here would break every
  # plain `docker compose` command for anyone who has not set exporter credentials. Populate them
  # with scripts/exporter-env.sh.
  mssql_exporter:
    profiles: [exporters]
    image: ${MSSQL_EXPORTER_IMAGE:-awaragi/prometheus-mssql-exporter:latest}
    container_name: evangelionerpv2_mssql_exporter
    environment:
      SERVER: ${MSSQL_EXPORTER_SERVER:-sqlserver}
      PORT: ${MSSQL_EXPORTER_PORT:-1433}
      USERNAME: ${MSSQL_EXPORTER_USER:-sa}
      PASSWORD: ${SQLSERVER_SA_PASSWORD:-}
    networks: [custom_network]
    restart: unless-stopped

  redis_exporter:
    profiles: [exporters]
    image: ${REDIS_EXPORTER_IMAGE:-oliver006/redis_exporter:latest}
    container_name: evangelionerpv2_redis_exporter
    environment:
      REDIS_ADDR: ${REDIS_EXPORTER_ADDR:-}
      REDIS_PASSWORD: ${REDIS_EXPORTER_PASSWORD:-}
    networks: [custom_network]
    restart: unless-stopped

  rabbitmq_exporter:
    profiles: [exporters]
    image: ${RABBITMQ_EXPORTER_IMAGE:-kbudde/rabbitmq-exporter:latest}
    container_name: evangelionerpv2_rabbitmq_exporter
    environment:
      RABBIT_URL: ${RABBITMQ_EXPORTER_URL:-}
      RABBIT_USER: ${RABBITMQ_EXPORTER_USER:-}
      RABBIT_PASSWORD: ${RABBITMQ_EXPORTER_PASSWORD:-}
      RABBIT_VHOST: ${RABBITMQ_EXPORTER_VHOST:-}
      # Default is "exchange node overview queue". `node` is dropped because CloudAMQP's shared
      # plans deny /api/nodes - you do not own the cluster - and it logs a 401 every scrape while
      # holding rabbitmq_up at 0.
      RABBIT_EXPORTERS: ${RABBITMQ_EXPORTER_COLLECTORS:-exchange,queue,overview}
      PUBLISH_PORT: "9419"
    networks: [custom_network]
    restart: unless-stopped

  grafana:
    # 12.0.0 and not 11.x: this exact provisioning was boot-verified against it - datasource, three
    # dashboards and all six alert rules load with health=ok. Nothing here uses a 12-only feature,
    # so an older tag would probably work too; this is the one that was actually tested.
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.0.0}
    container_name: evangelionerpv2_grafana
    environment:
      # `:?` and no default on purpose. A shipped default password on a dashboard that reads every
      # tenant's numbers is the whole exposure in one line.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env.local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Stops Grafana sending an MD5 of every user's email to gravatar.com on page load.
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"

      # Alert delivery. Empty defaults on purpose - compose interpolates this whole file before
      # profiles select anything, so a `:?` here would break every plain docker compose command.
      # Grafana simply reports SMTP as disabled when the host is blank.
      GF_SMTP_ENABLED: ${ALERT_SMTP_ENABLED:-false}
      # host:port, not host alone - Grafana fails with "missing port in address".
      GF_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      GF_SMTP_USER: ${ALERT_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${ALERT_SMTP_FROM:-alerts@evangelionerp.com}
      GF_SMTP_FROM_NAME: Evangelion ERP
      GF_SMTP_STARTTLS_POLICY: ${ALERT_SMTP_STARTTLS:-OpportunisticStartTLS}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-alerts@localhost}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://localhost:9/unconfigured}
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - custom_network

networks:
  custom_network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
