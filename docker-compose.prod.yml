# The production edge, for the EC2 instance. Named with -f alongside the main file:
#
#   docker compose --env-file .env \
#     -f docker-compose.yml -f docker-compose.prod.yml \
#     --profile workers --profile voice up -d
#
# Note which profiles are absent. `localdb` must not run here - the database is RDS - and `proxy`
# must not either, because nginx and Caddy would both want port 80. nginx remains the local
# development proxy on 8082; this file is the only thing that terminates TLS.
#
# A separate file rather than a profile for the same reason as the observability stack: compose
# interpolates every variable in a file before profiles select anything, so a production-only
# variable inside the main file would break plain `docker compose` commands for everyone else.

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    container_name: evangelionerpv2_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing on next start, which Let's
      # Encrypt rate-limits - five per week per domain. Worth keeping across a redeploy.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - custom_network
    depends_on:
      - evangelionerpv2

  # The API publishes no host port in production. Caddy reaches it over the Docker network, so
  # 8080 is not listening on the instance at all and the security group is not the only thing
  # between the internet and an unencrypted endpoint.
  #
  # It is also what makes the per-IP rate limiting real: AspNetCoreRateLimit identifies callers by
  # the X-Real-IP header, which Caddy overwrites with the peer address. Publish this port and any
  # caller can forge that header per request and never hit the 5/min cap on the login endpoints.
  evangelionerpv2:
    ports: !override []

volumes:
  caddy_data:
  caddy_config:

networks:
  custom_network:
    external: false
