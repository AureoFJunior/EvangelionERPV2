services:
  web:
    build:
      context: .
      dockerfile: EvangelionERPV2.Web/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      - rabbitmq

  worker_email:
    build:
      context: .
      dockerfile: EvangelionERPV2.Worker.Email/Dockerfile
    environment:
      HttpConfig__DefaultApiUrl: http://web:8080/api/v1
    depends_on:
      - rabbitmq

  worker_order:
    build:
      context: .
      dockerfile: EvangelionERPV2.Worker.Order/Dockerfile
    environment:
      HttpConfig__DefaultApiUrl: http://web:8080/api/v1
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
      - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
