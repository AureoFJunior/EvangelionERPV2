# Scrape config for the local stack. Targets are the unpublished :9101 metric servers the API and
# the workers open (see EvangelionERPV2.Web/Program.cs) - not /metrics on 8080, which is behind RBAC
# and would need a never-expiring token in this file to be scraped.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["evangelionerpv2:9101"]
        labels:
          service: api

  # These stay configured with the `workers` profile off, and Prometheus marks them down. That is
  # the correct reading of "the workers are not running" - not a reason to delete the job.
  - job_name: workers
    static_configs:
      - targets: ["worker_order:9101"]
        labels:
          service: worker_order
      - targets: ["worker_email:9101"]
        labels:
          service: worker_email
      - targets: ["worker_notification:9101"]
        labels:
          service: worker_notification

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# Grafana Cloud's free tier stores 10 000 active series. This API alone emits 14 000-24 000:
# http_request_duration_seconds is 19 series per label combination (16 buckets, +Inf, _sum, _count)
# across 184 controller actions. So the raw stream does not fit and must not be sent raw.
#
# Uncomment and fill in to ship. The keep list is deliberately narrow: the pre-aggregated recording
# rule instead of the raw histogram, everything this project emits itself, and the runtime counters.
# That lands around 2 000 series. Per-action detail stays in this local TSDB, which is where anyone
# actually debugging is sitting.
#
# The token must be a write-only (MetricsPublisher) key from AWS Secrets Manager. A leaked write
# token poisons data; a leaked read token exfiltrates every tenant's numbers.
#
# remote_write:
#   - url: ${GRAFANA_CLOUD_PROM_URL}
#     basic_auth:
#       username: ${GRAFANA_CLOUD_USER}
#       password_file: /run/secrets/grafana_cloud_token
#     write_relabel_configs:
#       - source_labels: [__name__]
#         regex: 'http_request_duration_seconds:.*|http_requests_received_total|up|evangelion_.*|dotnet_.*|process_.*'
#         action: keep
