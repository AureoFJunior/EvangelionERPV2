apiVersion: 1

providers:
  - name: evangelion
    orgId: 1
    folder: Evangelion
    type: file
    # The JSON is the source of truth. Edits made in the UI are overwritten on the next restart,
    # which is the point: a dashboard that only exists in somebody's browser is not a dashboard.
    disableDeletion: false
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
