apiVersion: 1

# Grafana's own alerting, not Alertmanager. Grafana is already running and already knows how to
# reach an inbox or a webhook; a second alert engine would be one more container and one more config
# file to buy nothing.
#
# Notifications go to whatever contact point the default notification policy names. Grafana ships
# with `grafana-default-email`, which is not configured here because it needs SMTP credentials -
# until somebody sets those, these rules fire and are visible in Alerting > Alert rules, and nothing
# is sent. That is a deliberate stopping point, not an oversight.
#
# Every alert here is a symptom, not a cause. Nothing alerts on CPU.
groups:
  - orgId: 1
    name: evangelion
    folder: Evangelion
    interval: 1m
    rules:

      - uid: eva-api-down
        title: ApiDown
        condition: B
        for: 2m
        # A target that has never been scraped is as bad as one that stopped answering.
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: The API has not answered a scrape for two minutes.
          description: Two missed scrapes, not one - a restart is not an outage.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: evangelion-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              expr: min(up{job="api"})
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: eva-dependency-unhealthy
        title: DependencyUnhealthy
        condition: B
        for: 5m
        # No data means the API is not publishing health at all, which ApiDown already covers.
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: A dependency has been below healthy for five minutes.
          description: >-
            Fires on Degraded as well as Unhealthy. That is deliberate: DatabaseHealthCheck reports
            Degraded - not Unhealthy - for pending migrations, and that is worth waking up for.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: evangelion-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              # One alert instance per dependency, so the notification names which one.
              expr: evangelion_health_check_status
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: eva-pending-migrations
        title: PendingMigrations
        condition: B
        # Deliberately slow. This should fire after a deploy that skipped the schema update, not
        # during one.
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: This database is behind the deployed branch.
          description: >-
            Nothing in the app calls Database.Migrate(). Requests touching the new tables answer 500
            with 'Invalid column name' until somebody runs scripts/local-db-update.sh.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: evangelion-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              expr: max(evangelion_pending_migrations)
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: eva-high-error-rate
        title: HighErrorRate
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: More than 2% of requests are answering 5xx.
          description: >-
            5xx only. A 4xx is the caller's problem and a 429 is the rate limiter doing its job -
            counting either would turn normal behaviour into an incident.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: evangelion-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              # Recording rule, so this alert and the dashboard panel cannot disagree about how the
              # ratio is computed.
              expr: http_requests:error_ratio5m
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.02] }

      - uid: eva-latency-p95
        title: LatencyP95
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: p95 request latency has been over one second for ten minutes.
          description: >-
            Keep this number equal to the budget in docs/performance/SPEC-stress-test.md, or delete
            one of the two. Two different definitions of "too slow" is worse than none.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: evangelion-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[10m])))
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }

      - uid: eva-worker-stalled
        title: WorkerStalled
        condition: B
        for: 15m
        # No data means no worker is publishing, which is the `workers` profile being off.
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: A queue has work waiting and nothing is consuming it.
          description: >-
            Depth above zero while the consume rate is flat. This is the failure liveness cannot see:
            the worker is up, healthy and processing nothing. It needed evangelion_queue_depth to be
            expressible at all - a rate of zero on its own is indistinguishable from an idle queue.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: evangelion-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              expr: (sum by (queue) (evangelion_queue_depth) > 0) and (sum by (queue) (rate(evangelion_worker_messages_total[15m])) == 0)
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: eva-dlq-not-empty
        title: DeadLetterQueueNotEmpty
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: Messages are sitting in a dead-letter queue.
          description: >-
            Nothing in this system consumes the DLQ, so anything here is lost until somebody redrives
            it by hand. Above zero is always worth looking at - see docs/messaging/ for why messages
            land here after twelve seconds.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: evangelion-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              expr: max by (queue) (evangelion_dlq_depth)
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: eva-worker-failing
        title: WorkerFailing
        condition: B
        for: 10m
        # A worker that is not running publishes nothing. That is the `workers` profile being off,
        # not an incident, so no data is not an alert.
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: A queue is producing failed messages.
          description: >-
            Counted per attempt, so a message that eventually succeeds on its third try still shows
            here - a queue that is limping is visible before it is stuck.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: evangelion-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              expr: sum by (queue) (rate(evangelion_worker_messages_total{result="failed"}[15m]))
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
